[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-agent"
version = "0.3.0"
description = "Contract Activation Theory agent: contract-disciplined alternative to ReAct"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyarrow>=16",
    "openai>=1.40",
    "httpx>=0.27",
    "jedi>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
bench = [
    "terminal-bench",
]

[project.scripts]
cat-chat = "cli.chat:main"
cat-bench = "cli.bench:main"
cat-report = "cli.report:main"
cat-trace-view = "tooling.trace.view:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cat*", "adapters*", "tooling*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:warnings"
markers = [
    "integration: hits real LLM; requires OPENROUTER_API_KEY",
    "docker: needs Docker (terminal-bench)",
]
python_files = ["test_*.py"]
